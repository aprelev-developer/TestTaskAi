# Локальное отклонение стенда, добавлено QA-сессией. Файлы объекта тестирования
# не изменялись — это отдельный файл, который Compose подхватывает автоматически.
#
# Причина: на машине уже работает чужой контейнер mysql57, занимающий порт 3306
# (запущен 11 дней, останавливать его нельзя). Приложение ходит в БД по внутренней
# сети Compose (DB_HOST=mysql), наружу порт 3306 ему не нужен вовсе — поэтому
# публикация порта снимается, а не переназначается.
#
# Порт приложения 8080 и phpMyAdmin 8081 свободны и остаются как в оригинале.

services:
  mysql:
    ports: !reset []
